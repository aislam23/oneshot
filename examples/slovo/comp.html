<script>
// ══════════════════════════════════════════════════════════════════════════════════════════════
// КОНЦЕПТ «Слово становится вещью». Материал ролика — слова диктора, набранные огромным шрифтом. Каждое ключевое слово
// превращается в то, что называет: СЛОВО → фигуры → ONESHOT; камера ныряет в букву О, там ролик; текст раскладывается по
// секундам; «слово» перещёлкивается в <HTML> и GSAP; РАЗМЫТИЕ пролетает со смазом; курсор вырастает в терминал, терминал —
// в чат; огромная цифра считает правила; УДАР, УДАР — склейки как приём, и чёрная тишина; черновик вырастает в 4K;
// печать БЕСПЛАТНО; в конце фигуры из первого кадра снова собирают имя.
//
// Сцены и их нити:               жест                                      нить в следующую
//  0–4.2    СЛОВО → фигуры       буквы падают; буквы сжимаются в фигуры     фигуры
//  4.6–9.2  ONESHOT, нырок в О   фигуры сходятся и взрываются словом; ×32    камера
//  9.7–13.5 Claude Code, Codex   отъезд; слова влетают с разных сторон      слова падают вниз
//  14.4–19.7 текст → секунды     печать фразы; слова разлетаются по линейке  линейка
//  20.1–23.8 каждое на слове     курсор времени, слова подпрыгивают          «слово» вырастает
//  24.2–30.8 HTML, GSAP, кадры   перебор букв; дорожки; плёнка; смаз          РАЗМЫТИЕ
//  31.8–34.9 установка           буквы падают, УСТАНОВКА из-под маски; курсор → терминал   терминал
//  35.3–39.7 команда             камера ведёт курсор печати                  терминал
//  40.2–45.2 через агента        терминал → чат, отправка                    камера-переброс
//  46.2–48.2 пять правил         огромная 5                                   цифра
//  48.6–77   правила 1–5         цифра крутится; у каждого правила свой жест  цифра / чёрный фон
//  77.7–90   бесплатно, ссылка, имя   печать; 4K → строка ссылки; фигуры собирают имя
// ══════════════════════════════════════════════════════════════════════════════════════════════
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const at = (el, x, y) => { el = typeof el === 'string' ? $(el) : el; el.style.left = x + 'px'; el.style.top = y + 'px'; return el; };
const box = el => { const r = (typeof el === 'string' ? $(el) : el).getBoundingClientRect(); return { x: r.x, y: r.y, w: r.width, h: r.height, cx: r.x + r.width / 2, cy: r.y + r.height / 2 }; };
const center = (el, cx, cy) => { el = typeof el === 'string' ? $(el) : el; const r = el.getBoundingClientRect(); at(el, cx - r.width / 2, cy - r.height / 2); return el; };
const A = { x: 960, y: 540 }, B = { x: 960, y: 1960 }, C = { x: 2300, y: 1960 }, E = { x: 2300, y: 3160 };   // E близко к C: на перебросе вниз в кадре всегда что-то есть
const REPO = 'github.com/aislam23/oneshot';

Promise.all(['900 100px "Sofia Sans Extra Condensed"', '500 40px "Golos Text"', '600 40px "Golos Text"', '400 80px "Comforter Brush"', '500 40px "JetBrains Mono"'].map(f => document.fonts.load(f))).then(build);

function build() {
const F = OS.film({ duration: VO.total, grid: 60 });
const L = F.L, W = F.W, EN = F.E;

// ═══ 1 · СЛОВО → фигуры ═══
const w1 = F.split('#w1'); center('#w1', A.x, A.y);
const SH = [
  { css: 'border-radius:50%;background:#1F2BFF' }, { css: 'background:#0A0A0A;clip-path:polygon(50% 0,100% 100%,0 100%)' },
  { css: 'border-radius:50%;border:34px solid #1F2BFF;box-sizing:border-box' }, { css: 'background:#0A0A0A;border-radius:22px' },
  { css: 'border-radius:50%;background:#0A0A0A' }];
const shapes = w1.map((ch, i) => { const b = box(ch), s = Math.min(b.w, b.h) * (i === 4 ? 0.55 : 0.82), d = document.createElement('div'); d.className = 'shape';
  d.style.cssText += `;${SH[i].css};left:${b.cx - s / 2}px;top:${b.cy - s / 2}px;width:${s}px;height:${s}px`; $('#shapes').appendChild(d); gsap.set(d, { autoAlpha: 0 }); return d; });
const tS = W(1, 'слово'), tK = W(1, 'картинкой');
// буквы падают с весом: ускорение, удар, сплющивание по скорости, отскок; каждый удар чуть толкает камеру
w1.forEach((c, i) => { F.drop(c, tS - 0.5 + i * 0.07, { height: 760, squash: 0.32 }); F.shake(F._lastHits[0].t, 3 + i, 9); });
w1.forEach((c, i) => F.tl.to(c, { scale: 0.25, autoAlpha: 0, duration: 0.3, ease: 'power3.in' }, tK - 0.1 + i * 0.06));
shapes.forEach((d, i) => F.tl.fromTo(d, { autoAlpha: 0, scale: 0.25, rotation: -40 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.6, ease: 'back.out(2.2)', immediateRender: false }, tK + 0.12 + i * 0.06));
w1.forEach((c, i) => F.sound(tS - 0.5 + i * 0.07 + Math.sqrt(2 * 760 / 5200), 'thump', { x: box(c).cx, f: 64 + i * 6, gain: 0.55 }));
shapes.forEach((d, i) => F.sound(tK + 0.12 + i * 0.06, 'pop', { x: box(d).cx, f: 420 + i * 70, gain: 0.7 }));

// ═══ 2 · ONESHOT; нырок в букву О ═══
const lg = F.split('#logo'); center('#logo', A.x, A.y);
const tO = W(2, 'oneshot');
shapes.forEach((d, i) => F.tl.to(d, { x: A.x - box(d).cx, y: A.y - box(d).cy, scale: 0.1, rotation: 180, duration: 0.42, ease: 'power3.in' }, tO - 0.45 + i * 0.03));
shapes.forEach(d => F.tl.to(d, { autoAlpha: 0, duration: 0.05 }, tO + 0.05));
gsap.set(lg, { autoAlpha: 0 });
lg.forEach((c, i) => { const b = box(c); F.tl.fromTo(c, { autoAlpha: 1, x: A.x - b.cx, scale: 0.15 }, { x: 0, scale: 1, duration: 0.7, ease: 'expo.out', immediateRender: false }, tO + 0.05 + Math.abs(i - 3) * 0.03); });
F.sound(tO + 0.05, 'thump', { f: 58 }); F.sound(tO - 0.45, 'rise', { dur: 0.5, gain: 0.6 });
const O = box(lg[0]), OC = { x: O.cx, y: O.y + O.h * 0.5 }, ZO = 32;
at('#inO', OC.x, OC.y); gsap.set('#inO', { scale: 1 / ZO, transformOrigin: '0 0', autoAlpha: 0 });
const tR = W(2, 'ролики'), tG = W(2, 'голос');
F.tl.set('#inO', { autoAlpha: 1 }, tR - 0.5);
F.tl.fromTo('#reel .ball', { x: 0, y: 0 }, { keyframes: [{ x: 300, y: -220, duration: 0.35, ease: 'power2.out' }, { x: 600, y: 0, duration: 0.35, ease: 'power2.in' }, { x: 860, y: -150, duration: 0.3, ease: 'power2.out' }, { x: 1040, y: 0, duration: 0.3, ease: 'power2.in' }], immediateRender: false }, tR + 0.1);
for (let i = 0; i < 40; i++) { const b = document.createElement('i'); b.style.left = (i * 32) + 'px'; $('#reel .bars').appendChild(b); }
F.seg('#bars', tG - 0.1, EN(2) + 1.2, (k, t) => { $$('#reel .bars i').forEach((b, i) => { const e = Math.min(1, (t - tG + 0.1) * 3) * (0.35 + 0.65 * Math.abs(Math.sin(i * 0.9 + t * 9) * Math.sin(i * 0.37 + t * 5.3))); b.style.height = (12 + e * 128).toFixed(1) + 'px'; }); });
F.sound(tR - 0.4, 'whoosh', { dur: 0.9, f0: 200, f1: 3000, gain: 1.2 });

// ═══ 3 · Claude Code / Codex ═══
const t3 = L(3), tC = W(3, 'Claude'), tX = W(3, 'Codex'), tA = W(3, 'агентах');
F.to('#logo', t3 + 0.3, { y: -330, scale: 0.42, duration: 0.6, ease: 'expo.inOut' });
F.to('#inO', t3 + 0.2, { autoAlpha: 0, duration: 0.3 });
center('#cc', A.x, A.y + 30); center('#cx', A.x, A.y + 250);
F.tl.fromTo('#cc', { x: 1900, autoAlpha: 1 }, { x: 0, duration: 0.45, ease: 'expo.out', immediateRender: false }, tC - 0.15); gsap.set('#cc', { autoAlpha: 0 });
F.tl.fromTo('#cx', { x: -1900, autoAlpha: 1 }, { x: 0, duration: 0.45, ease: 'expo.out', immediateRender: false }, tX - 0.15); gsap.set('#cx', { autoAlpha: 0 });
at('#hOther', A.x + 260, A.y + 330); F.pop('#hOther', tA - 0.1, { rot: -6, y: 20, from: 0.7 });
F.sound(tC - 0.15, 'whoosh', { x: A.x + 600, dur: 0.4, f0: 2500, f1: 500 }); F.sound(tX - 0.15, 'whoosh', { x: A.x - 600, dur: 0.4, f0: 2500, f1: 500 });
