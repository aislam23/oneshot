<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>oneshot · галерея движений</title>
<style>
:root{--paper:#E7E8EC;--ink:#0A0A0A;--muted:#5D606A;--accent:#1F2BFF;--card:#fff}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--paper);font-family:system-ui,-apple-system,sans-serif;color:var(--ink)}
#stage{position:absolute;inset:0}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.tile{position:absolute;width:440px;height:500px;background:var(--card);border-radius:22px;box-shadow:0 30px 60px -36px rgba(10,10,10,.3);overflow:hidden}
.tile h3{position:absolute;left:24px;top:18px;margin:0;font:800 30px/1 system-ui;text-transform:uppercase;letter-spacing:.01em}
.tile p{position:absolute;left:24px;top:56px;margin:0;font:500 17px/1.3 system-ui;color:var(--muted);width:390px}
.tile canvas{position:absolute;left:20px;bottom:16px}
.floor{position:absolute;left:30px;right:30px;top:330px;height:3px;background:rgba(10,10,10,.15)}
.box{position:absolute;width:80px;height:80px;border-radius:14px;background:var(--ink);transform-origin:50% 100%}
.ball{position:absolute;width:46px;height:46px;border-radius:50%;background:var(--accent)}
.dot{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--ink);transform-origin:50% 100%}
.card{position:absolute;width:180px;height:120px;border-radius:16px;background:var(--accent);transform-origin:50% 100%}
.tgt{position:absolute;width:18px;height:18px;border-radius:50%;border:3px solid var(--accent);box-sizing:border-box}
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../lib/oneshot.js"></script>
<script>
// Галерея: каждое физичное движение oneshot вживую и график его кривой (смещение по времени).
// ?play — по кругу; `oneshot gallery` снимает лист кадров и пишет замеры в docs/moves.md.
const F = OS.film({ duration: 2.6, grid: 0 }), P = OS.phys, W = document.getElementById('world');
const T0 = 0.25;
const tile = (i, name, note) => { const d = document.createElement('div'); d.className = 'tile'; d.style.left = (40 + (i % 4) * 470) + 'px'; d.style.top = (30 + Math.floor(i / 4) * 525) + 'px';
  d.innerHTML = `<h3>${name}</h3><p>${note}</p><div class="floor"></div><canvas width="800" height="200" style="width:400px;height:100px"></canvas>`; W.appendChild(d); F.life(d); return d; };
const el = (parent, cls, x, y) => { const e = document.createElement('div'); e.className = cls; e.style.left = x + 'px'; e.style.top = y + 'px'; parent.appendChild(e); return e; };
const plot = (t, fn, lo, hi) => { const c = t.querySelector('canvas').getContext('2d'); c.scale(2, 2); c.strokeStyle = 'rgba(10,10,10,.12)'; c.beginPath(); c.moveTo(0, 50); c.lineTo(400, 50); c.stroke();
  c.strokeStyle = '#1F2BFF'; c.lineWidth = 2.5; c.beginPath(); for (let i = 0; i <= 200; i++) { const tt = 2.2 * i / 200, v = fn(tt), y = 92 - (v - lo) / (hi - lo) * 84; i ? c.lineTo(i * 2, y) : c.moveTo(0, y); } c.stroke(); };

{ const t = tile(0, 'F.drop', 'падает с ускорением, сплющивается на ударе пропорционально скорости, отскакивает'); const b = el(t, 'box', 180, 250); F.drop(b, T0, { height: 220 }); plot(t, x => -P.drop(x, 220).y, 0, 220); }
{ const t = tile(1, 'F.land', 'удар расходится волной: соседи подпрыгивают по очереди, дальние — слабее'); const dots = [0, 1, 2, 3, 4].map(k => el(t, 'dot', 70 + k * 64, 300)); const ball = el(t, 'ball', 197, 284);
  F.drop(ball, T0, { height: 200, squash: 0.2 }); F.land(T0 + 0.39, dots, { at: { x: 230 + 40, y: 330 + 30 }, amp: 34, reach: 260, speed: 900 }); plot(t, x => Math.abs(P.ring(x, 2.4, 6)), 0, 1); }
{ const t = tile(2, 'F.throw', 'бросок по дуге с вращением; в полёте вытягивается вдоль скорости'); const b = el(t, 'ball', 50, 284); F.throw(b, T0, { dx: 300, dy: 0, arc: 190, spin: 360, dur: 0.8 }); plot(t, x => { const u = Math.min(1, x / 0.8); return 4 * u * (1 - u); }, 0, 1); }
{ const t = tile(3, 'F.anticipate', 'замах назад, рывок вперёд, перелёт и успокоение'); const b = el(t, 'box', 80, 250); F.anticipate(b, T0, { dx: 220 }); plot(t, x => (x < 0.16 ? -0.14 * Math.sin(Math.PI / 2 * x / 0.16) : -0.14 + 1.14 * P.spring(x - 0.16, 2.4, 0.5)), -0.2, 1.25); }
{ const t = tile(4, 'F.wobble', 'качнулся и успокоился — после удара, нажатия, приземления'); const c = el(t, 'card', 130, 210); F.wobble(c, T0, { amp: 0.1, rot: 8 }); plot(t, x => P.ring(x, 3, 5), -1, 1); }
{ const t = tile(5, 'F.punch', 'удар-акцент: резко больше и обратно с перелётом'); const d = el(t, 'box', 180, 250); d.style.transformOrigin = '50% 50%'; F.punch(d, T0, { scale: 1.4 }); plot(t, x => 1 + 0.4 * (1 - P.spring(x, 3.2, 0.35)) * Math.min(1, x / 0.04), 0.8, 1.45); }
{ const t = tile(6, 'F.follow', 'догоняет цель с запаздыванием и перелётом — как живой'); const tg = el(t, 'tgt', 60, 300), d = el(t, 'dot', 54, 294);
  const path = x => ({ x: x < T0 ? 0 : x < T0 + 0.6 ? 300 * gsap.parseEase('power2.inOut')((x - T0) / 0.6) : 300, y: 0 });
  F.seg('#g-tgt', 0, 2.6, (k, tt) => { tg.style.translate = path(tt).x + 'px 0px'; }); F.follow(d, 0, 2.6, path, { f: 1.6, d: 0.55 }); plot(t, x => P.spring(x, 1.6, 0.55), -0.1, 1.3); }
{ const t = tile(7, 'camera move', 'ключи камеры: whip — переброс, chase — догоняет с перелётом, glide — плавно'); const kinds = ['whip', 'chase', 'glide'], cols = ['#1F2BFF', '#0A0A0A', '#9097A6'];
  kinds.forEach((k, i) => { const b = el(t, 'dot', 50, 160 + i * 60); b.style.background = cols[i]; F.seg('#gk' + i, 0, 2.6, (q, tt) => { const u = Math.min(1, Math.max(0, (tt - T0) / 1.2)); b.style.translate = (300 * OS.operEase(k)(u)) + 'px 0px'; }); });
  const c = t.querySelector('canvas').getContext('2d'); c.scale(2, 2); kinds.forEach((k, i) => { c.strokeStyle = cols[i]; c.lineWidth = 2.5; c.beginPath(); for (let j = 0; j <= 200; j++) { const u = j / 200, y = 92 - OS.operEase(k)(u) / 1.25 * 84; j ? c.lineTo(j * 2, y) : c.moveTo(0, y); } c.stroke(); }); }
F.expose();
</script>
</body>
</html>
